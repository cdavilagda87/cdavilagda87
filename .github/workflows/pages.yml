name: Build & Deploy Dashboard

# Se ejecuta al hacer push a main (o manualmente)
on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'export_to_html.py'
      - 'requirements.txt'
      - 'netlify.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dependencias ─────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Agente (datos reales BCE → fallback demo) ─
      - name: Run agent
        run: python agent.py --max-files 5

      # ── 5. Exportar HTML estático ───────────────────
      - name: Export to static HTML
        run: python export_to_html.py

      # ── 6. Verificar ────────────────────────────────
      - name: Verify build
        run: |
          ls -lh docs/index.html
          echo "Size: $(wc -c < docs/index.html) bytes"

      # ── 7a. Deploy a Netlify (si el secreto existe) ──
      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './docs'
          production-branch: main
          production-deploy: true
          deploy-message: "Auto-deploy desde GitHub Actions — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

      # ── 7b. Deploy a GitHub Pages (fallback) ─────────
      - name: Setup Pages (fallback)
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact (fallback)
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages (fallback)
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        uses: actions/deploy-pages@v4

permissions:
  contents: read
  pages: write
  id-token: write
