# ─── Servidor ────────────────────────────────────────────────────
server.port=8081
spring.application.name=bce-dashboard

# ─── SQLite ──────────────────────────────────────────────────────
# Ruta a la DB generada por el agente Python
# (ajustar si el JAR se ejecuta desde una ubicación distinta)
app.db.path=${DB_PATH:../database/bce_data.db}

spring.datasource.url=jdbc:sqlite:${app.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5

# ─── Thymeleaf ───────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ─── Logs ────────────────────────────────────────────────────────
logging.level.com.dashboard=DEBUG
